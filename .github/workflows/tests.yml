name: tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - uses: actions/checkout@v5
        with:
          repository: espressif/mbedtls
          ref: 9d669eadb1955d348986b9280156710aaaadf79f
          path: .ci-mbedtls
          submodules: recursive
      - name: Native P-256 vectors with pinned SDK Mbed TLS
        shell: bash
        run: |
          cmake -S .ci-mbedtls -B /tmp/iotmd-host-mbedtls -DENABLE_PROGRAMS=OFF -DENABLE_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/iotmd-host-mbedtls --target mbedcrypto -j 4
          IOTMD_MBEDTLS_ROOT="$PWD/.ci-mbedtls" IOTMD_MBEDCRYPTO_LIB=/tmp/iotmd-host-mbedtls/library/libmbedcrypto.a python -m unittest discover -s tests -p test_native_p256.py -v
      - run: python tools/check_repository_hygiene.py
      - run: python tools/check_documentation.py
      - run: python tools/validate_json_schemas.py
      - run: python tools/check_accessibility.py
      - run: python tools/check_architecture.py
      - run: python tools/check_micropython_compat.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Offline portal DOM contracts
        working-directory: tests/browser
        run: |
          npm install --ignore-scripts
          npm run test:contracts
      - name: Compile host-only Python
        run: python -m py_compile tools/*.py tests/*.py
      - uses: actions/checkout@v5
        with:
          repository: micropython/micropython
          ref: v1.29.0
          path: .ci-micropython
      - name: Build pinned MicroPython compiler
        run: make -C .ci-micropython/mpy-cross
      - name: Compile MicroPython runtime
        shell: bash
        run: |
          set -e
          MPY_CROSS="$PWD/.ci-micropython/mpy-cross/build/mpy-cross"
          for file in *.py application/*.py device_modules/*.py services/*.py lib/*.py lib/primitives/*.py lib/uhcsr04/*.py; do
            "$MPY_CROSS" "$file" -o /tmp/ham-device-check.mpy
          done

  esp32-firmware-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: micropython/micropython
          ref: 0fd6c573ea815774668bbb16b8e197c8822368b2
          path: .ci-micropython
          submodules: recursive
          fetch-depth: 0
      - name: Create ephemeral CI signing material
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python tools/provision_update_signing.py \
            --private-key /tmp/iotmd-ci-update.key --generate
          python tools/generate_secure_boot_key.py \
            --esp-idf-root "$IDF_PATH" \
            --output /tmp/iotmd-ci-secure-boot.pem
      - name: Build complete secure ESP32-S3 firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source "$IDF_PATH/export.sh"
          # Use the project's pinned IDF 5.5 patch release. Upstream's
          # maintainer check requires its exact recommendation (5.5.2).
          unset MICROPY_MAINTAINER_BUILD
          python tools/build_micropython_firmware.py \
            --micropython-root .ci-micropython \
            --version ci \
            --release-sequence 1 \
            --output /tmp/iotmd-ci.iotcore \
            --factory-output /tmp/iotmd-ci.factory.bin \
            --signing-key /tmp/iotmd-ci-update.key \
            --production-security \
            --secure-boot-signing-key /tmp/iotmd-ci-secure-boot.pem \
            --factory-setup-password-output /tmp/iotmd-ci.setup-password.txt
