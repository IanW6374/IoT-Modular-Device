openapi: 3.1.0
info:
  title: IoT Modular Device API
  version: 2.5.0
  description: Mutual-TLS JSON API exposed by an IoT-MD device.
servers:
  - url: https://{device}:8444
    variables:
      device:
        default: device.local
security:
  - mutualTLS: []
paths:
  /api/v2/device:
    get:
      summary: Bounded device identity and version projection
      responses:
        '200': {description: Device summary, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceProjection'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v2/interfaces:
    get:
      summary: Network and messaging interface state
      responses:
        '200': {description: Interface state, content: {application/json: {schema: {$ref: '#/components/schemas/InterfaceProjection'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v2/hardware:
    get:
      summary: Hardware capabilities, drivers and resource bindings
      responses:
        '200': {description: Hardware projection, content: {application/json: {schema: {$ref: '#/components/schemas/HardwareProjection'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v2/services:
    get:
      summary: Runtime, boot and effective feature state
      responses:
        '200': {description: Service projection, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceProjection'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v2/configuration:
    get:
      summary: Non-secret operating configuration
      responses:
        '200': {description: Safe configuration projection, content: {application/json: {schema: {$ref: '#/components/schemas/ConfigurationProjection'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v2/configuration/profile:
    post:
      summary: Validate and apply a non-secret configuration profile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfigurationProfile'}
      responses:
        '202': {description: Profile accepted; device restart required}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v2/device/inventory:
    get:
      summary: Device and module inventory
      responses:
        '200': {description: Inventory, content: {application/json: {schema: {$ref: '#/components/schemas/Inventory'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v2/health:
    get:
      summary: Health history snapshot
      responses:
        '200': {description: Health snapshot, content: {application/json: {schema: {type: object, required: [api_version, health], properties: {api_version: {const: 2}, health: {type: object, additionalProperties: true}}}}}}
  /api/v2/events:
    get:
      summary: Read events after a cursor
      parameters:
        - {name: cursor, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 256, default: 32}}
      responses:
        '200': {description: Event page, content: {application/json: {schema: {$ref: '#/components/schemas/EventPage'}}}}
  /api/v2/support:
    get:
      summary: Redacted support snapshot
      responses:
        '200': {description: Support data, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v2/modules:
    get:
      summary: List modules
      responses:
        '200': {description: Module catalog, content: {application/json: {schema: {type: object, required: [api_version, modules], properties: {api_version: {const: 2}, modules: {type: array, items: {$ref: '#/components/schemas/Module'}}}}}}}
  /api/v2/modules/{uuid}/state:
    parameters: [{$ref: '#/components/parameters/ModuleUuid'}]
    get:
      summary: Current module state
      responses:
        '200': {description: State, content: {application/json: {schema: {$ref: '#/components/schemas/ModulePayload'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/modules/{uuid}/diagnostics:
    parameters: [{$ref: '#/components/parameters/ModuleUuid'}]
    get:
      summary: Current module diagnostics
      responses:
        '200': {description: Diagnostics, content: {application/json: {schema: {$ref: '#/components/schemas/ModulePayload'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/modules/{uuid}/commands:
    parameters: [{$ref: '#/components/parameters/ModuleUuid'}]
    post:
      summary: Submit a driver command
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses:
        '202': {description: Accepted operation, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/operations/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1}}
    get:
      summary: Read operation status
      responses:
        '200': {description: Operation, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v2/fleet:
    get:
      summary: Fleet state
      responses:
        '200': {description: Fleet state, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v2/fleet/policy:
    post:
      summary: Apply fleet policy
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: true}}}
      responses:
        '202': {description: Policy accepted, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v2/fleet/commands/{id}/result:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, minLength: 1}}
    post:
      summary: Complete a fleet command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                result: {type: string, default: complete}
                detail: {type: string}
      responses:
        '200': {description: Updated command, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
  /api/v2/qualification:
    get:
      summary: Read complete qualification status
      responses:
        '200': {description: Qualification status, content: {application/json: {schema: {type: object, required: [api_version, qualification], properties: {api_version: {const: 2}, qualification: {type: object, additionalProperties: true}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v2/qualification/events:
    post:
      summary: Append an observed controlled qualification result
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/QualificationEvent'}}}
      responses:
        '202': {description: Evidence accepted, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v2/qualification/scenarios/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {enum: [watchdog-recovery, native-recovery]}}
    post:
      summary: Start an allowlisted disruptive Alpha qualification scenario
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/QualificationScenario'}}}
      responses:
        '202': {description: Scenario accepted, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    mutualTLS: {type: mutualTLS, description: Enrolled client certificate and scope registry}
  parameters:
    ModuleUuid: {name: uuid, in: path, required: true, schema: {type: string, pattern: '^[0-9A-Fa-f]{4}$'}}
  schemas:
    DeviceProjection:
      type: object
      required: [api_version, device]
      properties:
        api_version: {const: 2}
        device: {type: object, additionalProperties: true}
    InterfaceProjection:
      type: object
      required: [api_version, interfaces]
      properties:
        api_version: {const: 2}
        interfaces: {type: object, additionalProperties: true}
    HardwareProjection:
      type: object
      required: [api_version, hardware]
      properties:
        api_version: {const: 2}
        hardware: {type: object, additionalProperties: true}
    ServiceProjection:
      type: object
      required: [api_version, services]
      properties:
        api_version: {const: 2}
        services: {type: object, additionalProperties: true}
    ConfigurationProjection:
      type: object
      required: [api_version, configuration]
      properties:
        api_version: {const: 2}
        configuration: {type: object, additionalProperties: true}
    ConfigurationProfile:
      type: object
      additionalProperties: false
      required: [format_version, name, settings]
      properties:
        format_version: {const: 1}
        name: {type: string, minLength: 1, maxLength: 64}
        description: {type: string, maxLength: 256}
        settings: {type: object, minProperties: 1, additionalProperties: true}
    Inventory:
      type: object
      required: [api_version, device, modules]
      properties:
        api_version: {const: 2}
        device: {type: object, additionalProperties: true}
        modules: {type: array, items: {$ref: '#/components/schemas/Module'}}
        fleet: {oneOf: [{type: object, additionalProperties: true}, {type: 'null'}]}
    Module:
      type: object
      additionalProperties: true
      properties:
        uuid: {type: string, pattern: '^[0-9A-Fa-f]{4}$'}
        name: {type: string}
        type: {type: object, additionalProperties: true}
        capabilities: {type: array, items: {type: string}}
    ModulePayload:
      type: object
      required: [module]
      properties:
        module: {type: string}
        state: {type: object, additionalProperties: true}
        diagnostics: {type: object, additionalProperties: true}
    Operation:
      type: object
      required: [id, status]
      additionalProperties: true
      properties:
        id: {type: string}
        status: {enum: [pending, running, complete, failed]}
        result: {}
        error: {type: string}
    QualificationEvent:
      type: object
      additionalProperties: false
      required: [gate, outcome, run_id, confirm]
      properties:
        gate: {enum: [native-recovery, watchdog-recovery, identity-interoperability, fleet-interoperability, migration-rollback, driver-hardware]}
        outcome: {enum: [success, failure]}
        run_id: {type: string, minLength: 1, maxLength: 64}
        notes: {type: string, maxLength: 160}
        evidence_digest: {type: string, maxLength: 96}
        confirm: {const: true}
    QualificationScenario:
      type: object
      additionalProperties: false
      required: [run_id, confirmation]
      properties:
        run_id: {type: string, minLength: 1, maxLength: 64}
        confirmation: {type: string, minLength: 1, maxLength: 80}
    EventPage:
      type: object
      additionalProperties: true
      properties:
        cursor: {type: integer}
        next_cursor: {type: integer}
        events: {type: array, items: {type: object, additionalProperties: true}}
    Error:
      type: object
      required: [error]
      properties: {error: {type: string}}
  responses:
    BadRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Client lacks the required scope, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unavailable: {description: Service unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
